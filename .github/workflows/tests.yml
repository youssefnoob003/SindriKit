name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  docs:
    name: Documentation audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify links, anchors, fences and identifiers
      run: python scripts/audit_docs.py

    - name: Integration runner self-tests
      run: python tests/loaders/selftest_common.py

  integration:
    name: Unit + integration (dual-arch)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install test dependencies
      # pe_mutator.py needs pefile; without it --mutate is silently skipped.
      run: python -m pip install -r requirements-dev.txt

    - name: Configure and build (tests + unit tests + PoCs, debug)
      # build.bat configures and compiles build32/ and build64/ in Release.
      # 'tests' enables SND_BUILD_TESTS + SND_BUILD_UNIT_TESTS + payloads with debug output.
      run: cmd /c build.bat tests

    - name: Unit tests (x64)
      run: ctest --test-dir build64 -C Release --output-on-failure

    - name: Unit tests (x86)
      run: ctest --test-dir build32 -C Release --output-on-failure

    # x64 runs the full matrix. x86 syscall backends are excluded here because
    # the hosted Windows image's x86/WOW64 ntdll resolves differently and those
    # specs fail there; they pass on supported builds (run the full matrix
    # locally with `python tests/loaders/pe/test_runner.py --mutate`).
    # --strict turns every skip / missing dependency into a hard failure, so a
    # green run provably executed every selected case.
    - name: PE loader integration matrix (x64, full + mutation)
      run: python tests/loaders/pe/test_runner.py --mutate --strict --arch x64

    - name: PE loader integration matrix (x86, non-syscall)
      run: python tests/loaders/pe/test_runner.py --mutate --strict --arch x86 --exclude-substr Syscalls

    - name: COFF loader integration matrix (x64)
      run: python tests/loaders/coff/test_runner.py --strict --arch x64

    - name: COFF loader integration matrix (x86, non-syscall)
      run: python tests/loaders/coff/test_runner.py --strict --arch x86 --exclude-substr Syscalls

    # Injection matrices assert a remote side effect (a marker file written by
    # the injected payload). x86 hijack is an expected ARCH_MISMATCH rejection.
    - name: Injection matrices (x64)
      run: python tests/injection/test_runner.py --strict --arch x64

    - name: Injection matrices (x86, non-syscall)
      run: python tests/injection/test_runner.py --strict --arch x86 --exclude-substr Syscalls
